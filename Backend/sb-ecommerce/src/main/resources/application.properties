spring.config.import=optional:file:.env[.properties]
spring.application.name=sb-ecommerce
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Datasource
#
# Credentials are read from the environment. They used to be literals in this
# file - a Postgres password, and a commented-out block containing live AWS RDS
# credentials and that instance's hostname.
#
# The ${VAR} placeholders below have no default, so the application fails to
# start with a clear message if a variable is missing, rather than silently
# attempting to connect as nobody.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sb-ecom}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# Schema management
#
# Flyway owns the schema (src/main/resources/db/migration). ddl-auto=validate
# makes Hibernate compare the entity mappings against the real schema at startup
# and fail fast on a mismatch. Previously ddl-auto was not set at all, which for
# a non-embedded datasource means "none" - so the schema was maintained by hand
# and nothing in the repository described it.
#
# If validate rejects your existing database, set DDL_AUTO=update once to let
# Hibernate reconcile it, then generate a fresh baseline (see
# db/migration/README.md) and switch back to validate.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Lets Flyway adopt an existing, already-populated database instead of refusing
# to run against a non-empty schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# File storage
# ---------------------------------------------------------------------------
project.image=images/
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images/}

# Uploads are admin-only, but cap them anyway.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------------------------
# JWT
#
# jwtSecret must be a Base64-encoded value of at least 256 bits (32 bytes);
# jjwt rejects anything shorter for HS256. Generate one with:
#   openssl rand -base64 48
#
# The previous value was a hand-typed literal committed to this file. Treat it as
# compromised and issue a new one - anyone holding it can mint valid tokens for
# any user.
# ---------------------------------------------------------------------------
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationInMs=${JWT_EXPIRATION_MS:3000000}
spring.ecom.app.jwtCookieName=springBootEcom

# Cookie hardening. The JWT cookie is now HttpOnly unconditionally; these two
# control the remaining attributes.
# Set APP_JWT_COOKIE_SECURE=true for any deployment served over HTTPS.
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}
# Lax is what substitutes for CSRF tokens here - see WebSecurityConfiguration.
# Only change to None if the frontend lives on a different registrable domain,
# and re-enable CSRF protection if you do.
app.jwt.cookie-same-site=${APP_JWT_COOKIE_SAME_SITE:Lax}

# ---------------------------------------------------------------------------
# Payments
# ---------------------------------------------------------------------------
stripe.secret.key=${STRIPE_SECRET_KEY}
# Currency is fixed server-side; it used to arrive in the request body.
app.payment.currency=${PAYMENT_CURRENCY:usd}

# ---------------------------------------------------------------------------
# Optional demo account seeding - see DemoDataInitializer.
# Leave false everywhere except your own machine.
# ---------------------------------------------------------------------------
app.seed-demo-users=${APP_SEED_DEMO_USERS:false}
app.demo.admin-password=${APP_ADMIN_PASSWORD:}
app.demo.seller-password=${APP_SELLER_PASSWORD:}
app.demo.user-password=${APP_USER_PASSWORD:}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ---------------------------------------------------------------------------
# API docs. Turn both off in production: the schema is a map of every endpoint.
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ---------------------------------------------------------------------------
# Logging
#
# Was DEBUG for org.springframework, org.springframework.security,
# org.hibernate.SQL and the application package, unconditionally. At that level
# Spring Security logs request details and the app logged JWTs outright, so any
# log aggregator became a credential store. INFO by default, overridable per run.
# ---------------------------------------------------------------------------
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.level.com.example.project=${LOG_LEVEL_APP:INFO}

# ---------------------------------------------------------------------------
# Actuator. Expose only what is needed; the default in older setups was to open
# a broad set of endpoints.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Removed
#
#   spring.h2.console.enabled=true
#       An H2 console on a Postgres application. It was also whitelisted with
#       permitAll in the security config, and required frameOptions to be
#       relaxed to sameOrigin.
#
#   the commented MySQL and AWS RDS datasource blocks
#       They carried two real passwords and the RDS endpoint hostname.
# ---------------------------------------------------------------------------
spring.jpa.open-in-view=false
